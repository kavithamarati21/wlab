<!DOCTYPE html>
<html>
<head>
  <title>Text Animation</title>

  <style>
    body {
  text-align: center;
  background-color: white;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}


    #animatedText {
      font-family: Arial;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1 id="animatedText"></h1>

  <script>
    var textElement = document.getElementById("animatedText");
    var fontSize = 10;
    var isGrowing = true;

    textElement.innerText = "TEXT-GROWING";
    textElement.style.color = "lightpink";

    var timerId = setInterval(changeSize, 100);

    function changeSize()
    {
      if (isGrowing == true)
      {
        fontSize = fontSize + 2;

        if (fontSize >= 60)
        {
          isGrowing = false;
          textElement.innerText = "TEXT-SHRINKING";
          textElement.style.color = "cyan";
        }
      }
      else
      {
        fontSize = fontSize - 2;

        if (fontSize <= 10)
        {
          isGrowing = true;
          textElement.innerText = "TEXT-GROWING";
          textElement.style.color = "lightpink";
        }
      }

      textElement.style.fontSize = fontSize + "pt";
    }
  </script>

</body>
</html>
